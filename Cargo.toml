[package]
name = "nanolang"
default-run = "nano"
version = "0.1.0"
edition = "2021"
description = "Nano programming language and native runtime"

[[bin]]
name = "nano"
path = "src/main.rs"

[dependencies]
half = "2.7.1"
pollster = "1.0.1"
wgpu = "30.0.1"
serde_json = "1.0"
winit = "0.30"
rustls = "0.23.45"
webpki-roots = "1.0.9"
