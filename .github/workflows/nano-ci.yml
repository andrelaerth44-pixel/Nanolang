name: Nano CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nano-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo test
        run: cargo test --all-targets

      - name: GPU shader end to end
        run: NANO_GPU_E2E=1 cargo test --all-targets gpu_matmul_can_execute_with_fallback_adapter -- --exact

      - name: NPU provider end to end
        run: |
          cargo build --quiet --bin nano-npu-provider-reference --bin nano
          NANO_NPU_PROVIDER="$PWD/target/debug/nano-npu-provider-reference" cargo run --quiet --bin nano -- run --backend npu examples/npu.nano

      - name: Native CPU end to end
        run: |
          NANO_KEEP_ASM=1 cargo run --quiet --bin nano -- build --native examples/native.nano -o /tmp/nano-native
          if [ -f /tmp/nano-native.s ]; then sed -n '1,420p' /tmp/nano-native.s; fi
          set +e
          stdbuf -o0 /tmp/nano-native > /tmp/nano-native.out
          native_status=$?
          set -e
          cat /tmp/nano-native.out
          printf '5\n6\n2\ntrue\n1\n' > /tmp/nano-native.expected
          diff -u /tmp/nano-native.expected /tmp/nano-native.out
          test "$native_status" -eq 0

      - name: Native text values
        run: |
          cargo run --quiet --bin nano -- build --native examples/native_text.nano -o /tmp/nano-native-text
          /tmp/nano-native-text > /tmp/nano-native-text.out
          printf 'native-text\nnative-return\n' > /tmp/nano-native-text.expected
          diff -u /tmp/nano-native-text.expected /tmp/nano-native-text.out

      - name: Native text parameters
        run: |
          cargo run --quiet --bin nano -- build --native examples/native_text_param.nano -o /tmp/nano-native-text-param
          /tmp/nano-native-text-param > /tmp/nano-native-text-param.out
          printf 'native-param\nanswer\n42\nanswer\n' > /tmp/nano-native-text-param.expected
          diff -u /tmp/nano-native-text-param.expected /tmp/nano-native-text-param.out

      - name: Native math builtins
        run: |
          cargo run --quiet --bin nano -- build --native examples/native_math.nano -o /tmp/nano-native-math
          /tmp/nano-native-math > /tmp/nano-native-math.out
          printf '4\n3\n3\n4\n4\n8\n2\n5\n' > /tmp/nano-native-math.expected
          diff -u /tmp/nano-native-math.expected /tmp/nano-native-math.out

      - name: Native null and truthiness
        run: |
          cargo run --quiet --bin nano -- build --native examples/native_null.nano -o /tmp/nano-native-null
          /tmp/nano-native-null > /tmp/nano-native-null.out
          printf 'side-effect\nnull\ntrue\ntrue\n' > /tmp/nano-native-null.expected
          diff -u /tmp/nano-native-null.expected /tmp/nano-native-null.out

      - name: Native text operators
        run: |
          cargo run --quiet --bin nano -- build --native examples/native_text_ops.nano -o /tmp/nano-native-text-ops
          /tmp/nano-native-text-ops > /tmp/nano-native-text-ops.out
          printf 'nano-lang\ntrue\ntrue\n' > /tmp/nano-native-text-ops.expected
          diff -u /tmp/nano-native-text-ops.expected /tmp/nano-native-text-ops.out

      - name: Native first-class function values
        run: |
          cargo run --quiet --bin nano -- build --native examples/function_values.nano -o /tmp/nano-function-values
          /tmp/nano-function-values > /tmp/nano-function-values.out
          printf '5\n' > /tmp/nano-function-values.expected
          diff -u /tmp/nano-function-values.expected /tmp/nano-function-values.out

      - name: Main entrypoint
        run: |
          cargo run --quiet --bin nano -- run examples/entrypoint.nano > /tmp/nano-entrypoint.out
          printf 'entrypoint-ok\n' > /tmp/nano-entrypoint.expected
          diff -u /tmp/nano-entrypoint.expected /tmp/nano-entrypoint.out

      - name: Self-host source checks
        run: |
          echo "=== Nano check: selfhost/lexer.nano ==="
          cargo run --quiet --bin nano -- check selfhost/lexer.nano
          echo "=== PASS: selfhost/lexer.nano ==="

          echo "=== Nano check: selfhost/parser.nano ==="
          cargo run --quiet --bin nano -- check selfhost/parser.nano
          echo "=== PASS: selfhost/parser.nano ==="

          echo "=== Nano check: selfhost/compiler.nano ==="
          cargo run --quiet --bin nano -- check selfhost/compiler.nano
          echo "=== PASS: selfhost/compiler.nano ==="

      - name: Self-host bootstrap
        run: |
          cargo run --quiet --bin nano -- check selfhost/bootstrap.nano
          cargo run --quiet --bin nano -- run selfhost/bootstrap.nano > /tmp/nano-selfhost.ir
          test -s /tmp/nano-selfhost.ir
          grep -q "const " /tmp/nano-selfhost.ir
          grep -q "call " /tmp/nano-selfhost.ir
          grep -q "function add(a, b)" /tmp/nano-selfhost.ir
          grep -q "end_function" /tmp/nano-selfhost.ir
          grep -q "jump_if_false" /tmp/nano-selfhost.ir

      - name: UI syntax check
        run: cargo run --quiet --bin nano -- check examples/ui.nano

      - name: Lint check
        run: |
          cargo run --quiet --bin nano -- lint examples/native.nano
          cargo run --quiet --bin nano -- lint selfhost/bootstrap.nano

      - name: Formatter check
        run: cargo run --quiet --bin nano-fmt -- --check examples

      - name: Package toolchain
        run: |
          rm -rf /tmp/nano-package /tmp/nano-package-lib
          mkdir -p /tmp/nano-package-lib
          cargo run --quiet --bin nano -- package init /tmp/nano-package
          cargo run --quiet --bin nano -- package add local=/tmp/nano-package-lib /tmp/nano-package
          cargo run --quiet --bin nano -- package remove local /tmp/nano-package
          cargo run --quiet --bin nano -- package lock /tmp/nano-package
          cargo run --quiet --bin nano -- package verify /tmp/nano-package

      - name: Nano integration tests
        run: cargo run --quiet --bin nano -- test tests
