name: Nano CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nano-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo check
        run: cargo check --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cargo test
        run: cargo test --all-targets

      - name: Native CPU end to end
        run: |
          cargo run --quiet -- build --native examples/native.nano -o /tmp/nano-native
          /tmp/nano-native > /tmp/nano-native.out
          printf '5\n6\n2\ntrue\n1\n' > /tmp/nano-native.expected
          diff -u /tmp/nano-native.expected /tmp/nano-native.out
